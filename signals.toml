# signals.toml
# Defines 21cm signal model curves for the residual panel.
# Each entry is one curve plotted on the residual subplot.
#
# z_col      : column name for redshift
# tb_col     : column name for brightness temperature (mK)
# tb_sign    : 1 or -1 — multiply Tb by this to get absorption-negative convention
# freq_MHz   : if true, z_col is actually frequency in MHz (skip z->freq conversion)

[signals.fob2006_standard]
file       = "FOH2006_Tb_datasets.csv"
label      = "FOB 2006 (standard ΛCDM)"
z_col      = "z"
tb_col     = "Tb"
tb_sign    = 1
linestyle  = "-"
color      = "#333333"
linewidth  = 1.1
zorder     = 5

[signals.mondal2023_standard]
file       = "Mondal2023_Fig3_Tb_datasets.csv"
label      = "Mondal+ 2023 (standard)"
z_col      = "z.2"
tb_col     = "Standard"
tb_sign    = -1
linestyle  = "--"
color      = "#555555"
linewidth  = 1.4
zorder     = 4

[signals.mondal2023_Ar0p4]
file       = "Mondal2023_Fig3_Tb_datasets.csv"
label      = "Mondal+ 2023 (Ar = 0.4)"
z_col      = "z.1"
tb_col     = "Ar0.4"
tb_sign    = 1
linestyle  = "-."
color      = "#cc3311"
linewidth  = 1.4
zorder     = 4

[signals.mondal2023_Ar0p001]
file       = "Mondal2023_Fig3_Tb_datasets.csv"
label      = "Mondal+ 2023 (Ar = 0.001)"
z_col      = "z"
tb_col     = "Ar0.001"
tb_sign    = 1
linestyle  = ":"
color      = "#0077bb"
linewidth  = 1.4
zorder     = 4

[signals.magg2022_fII1]
file       = "Magg2022_Fig8_Tb_datasets.csv"
label      = "Magg+ 2022 (Pop II, fII=1)"
z_col      = "z_fII1"
tb_col     = "Tb_fII1"
tb_sign    = 1
linestyle  = "-"
color      = "#1b7837"
linewidth  = 1.4
zorder     = 4
source     = "Magg et al. (2022)"
bibkey     = "2022MNRAS.514.4433M"
note       = "Fig 8 bottom-left, fully metal-enriched (Pop II) limit; digitized"

[signals.magg2022_fII0]
file       = "Magg2022_Fig8_Tb_datasets.csv"
label      = "Magg+ 2022 (Pop III, fII=0)"
z_col      = "z_fII0"
tb_col     = "Tb_fII0"
tb_sign    = 1
linestyle  = "--"
color      = "#5aae61"
linewidth  = 1.4
zorder     = 4
source     = "Magg et al. (2022)"
bibkey     = "2022MNRAS.514.4433M"
note       = "Fig 8 bottom-left, pure primordial (Pop III) limit; digitized"
