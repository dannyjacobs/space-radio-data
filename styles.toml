# styles.toml
# Visual style for each dataset key. Keys must match datasets.toml exactly.
# All fields except those listed below map directly to matplotlib errorbar kwargs.
#
# Special fields (not passed to matplotlib):
#   enabled      : bool - set false to hide without deleting
#   legend_group : str  - controls legend section grouping

# ── Residual panel layout options ────────────────────────────────────────────
# These control the bottom subplot appearance and are read by plot_spectrum.py.
# freq_min / freq_max : x-range for residual panel (data clipped outside this)
# ylim_pos            : upper y limit in plot units (K or mK depending on --unit)
# symlog_linthresh    : boundary between linear and log regions of symlog y-axis
#                       (in same units as ylim_pos)
[residual_panel]
freq_min         = 1.0       # MHz — matches foreground fit lower cutoff
freq_max         = 300.0     # MHz
ylim_pos         = 50000.0   # K  — show ±50000 K to capture data scatter
symlog_linthresh = 0.005       # K  — linear region ±1 K; 21cm signal (~0.04K) visible

# ── Dataset styles ────────────────────────────────────────────────────────────
# Color rationale:
#   Space missions get warm distinct colors (each is a named instrument)
#   Ground dipole : slate blue  (wide beam, direction uncertain)
#   Ground hi-res : teal/green  (well-defined pointing, harder to globalize)

[styles.imp6]
enabled      = true
color        = "#b22222"    # firebrick — IMP-6, has real error bars
marker       = "o"
markersize   = 5
linestyle    = "none"
capsize      = 3
elinewidth   = 1.2
zorder       = 7
alpha        = 1.0
legend_group = "space"

[styles.rae2]
enabled      = true
color        = "#e07020"    # burnt orange — RAE-2
marker       = "^"
markersize   = 5
linestyle    = "none"
zorder       = 6
alpha        = 0.85
legend_group = "space"

[styles.rae1]
enabled      = true
color        = "#c8a000"    # golden — RAE-1
marker       = "D"
markersize   = 4
linestyle    = "none"
zorder       = 5
alpha        = 0.85
legend_group = "space"

[styles.benediktov]
enabled      = true
color        = "#9050c0"    # purple — Soviet mission, visually distinct
marker       = "s"
markersize   = 4
linestyle    = "none"
zorder       = 5
alpha        = 0.85
legend_group = "space"

[styles.ground_dipole]
enabled      = true
color        = "#2255aa"    # slate blue
marker       = "o"
markersize   = 3
linestyle    = "none"
zorder       = 3
alpha        = 0.55
legend_group = "ground"

[styles.ground_hires]
enabled      = true
color        = "#228866"    # teal
marker       = "s"
markersize   = 3
linestyle    = "none"
zorder       = 4
alpha        = 0.55
legend_group = "ground"

[styles.bowman2018_tsky]
enabled      = false        # top panel covered by Mozdzen model line; suppress raw points
color        = "#cc0077"
marker       = "."
markersize   = 2
linestyle    = "none"
zorder       = 8
alpha        = 0.7
top_only     = true
legend_group = "ground"

[styles.bowman2018_tres1]
enabled      = true
color        = "#cc0077"
marker       = "."
markersize   = 2
linestyle    = "none"
zorder       = 8
alpha        = 0.8
legend_group = "ground"
resid_only   = true      # only appears in residual panel, not top panel
